<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Акушерство и гинекология — тест</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app"></main>

  <noscript>
    <p class="app">Для работы теста в браузере должен быть включён JavaScript.</p>
  </noscript>

  <script>
    // Если в questions.js есть ошибка записи — запоминаем номер строки
    window.addEventListener("error", function (e) {
      if (e.filename && e.filename.indexOf("questions.js") !== -1) {
        window.__questionsError = { line: e.lineno, message: e.message };
      }
    });
  </script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
