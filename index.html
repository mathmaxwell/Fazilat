<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hamshiralar testi · Тест для медсестёр</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main id="app" class="app"></main>

  <noscript>
    <p class="app">Test ishlashi uchun brauzerda JavaScript yoqilgan bo'lishi kerak.<br>
    Для работы теста в браузере должен быть включён JavaScript.</p>
  </noscript>

  <script>
    // Savol fayllari o'zini shu funksiya orqali qo'shadi. · Файлы вопросов добавляют себя через эту функцию.
    var QUESTION_BANK = [];
    function addQuestions(data) {
      var src = (document.currentScript ? document.currentScript.src : "").split(/[?#]/)[0];
      data.file = decodeURI(src.slice(src.lastIndexOf("/questions/") + 1));
      QUESTION_BANK.push(data);
    }

    // Faylda yozuv xatosi bo'lsa, qator raqamini ushlab qolish uchun.
    // Чтобы показать номер строки, если в файле ошибка записи.
    var LOAD_ERRORS = [];
    window.addEventListener("error", function (e) {
      var m = (e.filename || "").split(/[?#]/)[0].match(/\/(settings\.js|questions\/[^\/]+\.js)$/);
      if (m) LOAD_ERRORS.push({ file: decodeURI(m[1]), line: e.lineno, message: e.message });
    });
  </script>

  <!-- Yangi mavzu qo'shish uchun questions/ papkasiga fayl qo'shing va shu yerga qator yozing.
       Чтобы добавить новую тему, создайте файл в папке questions/ и добавьте строку сюда.

       ?v=3 — versiya. Saytdagi fayllarni yangilagach, raqamni oshiring (v=4, v=5 ...),
       shunda brauzerlar eski nusxani emas, yangisini yuklaydi.
       ?v=3 — версия. После обновления файлов на сайте увеличьте число (v=4, v=5 ...),
       чтобы браузеры загрузили новые файлы, а не старые из кэша. -->
  <script src="settings.js?v=3"></script>
  <script src="questions/uz-obstetrics.js?v=3"></script>
  <script src="questions/uz-genetics.js?v=3"></script>
  <script src="questions/ru-obstetrics.js?v=3"></script>
  <script src="questions/ru-genetics.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
